name: Publiceer naar gh-pages

# GitHub Pages serveert de branch gh-pages. Deze workflow houdt die branch
# gelijk aan de standaardbranch, zodat een push automatisch live gaat.

on:
  push:
    branches: [claude/koelkasten-visual-overview-9r90nu]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Site naar gh-pages duwen
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Workflowbestanden horen niet op de publicatiebranch: de
          # GITHUB_TOKEN mag ze niet pushen.
          git checkout --orphan gh-pages
          git rm -r --cached .github --quiet
          rm -rf .github
          git add -A
          git commit -q -m "Publiceer site vanaf ${GITHUB_SHA}"
          git push -f origin gh-pages
